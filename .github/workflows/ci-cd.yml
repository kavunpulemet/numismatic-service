name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker
        uses: docker/setup-buildx-action@v1

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build and start services
        run: |
          docker-compose up -d --build

      - name: Show MongoDB logs
        run: docker logs numismatic-service_mongo_1 || true

      - name: Wait for MongoDB to be ready
        run: |
          until docker exec numismatic-app mongo --eval "db.stats()" > /dev/null 2>&1; do
            echo "Waiting for MongoDB to start..."
            sleep 2
          done

      - name: Run tests
        run: |
          docker exec numismatic-app go test ./tests

      - name: Stop and remove containers
        run: |
          docker-compose down
