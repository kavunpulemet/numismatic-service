name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker
        uses: docker/setup-buildx-action@v1

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build and start services
        run: |
          docker-compose up -d --build app

      - name: Show MongoDB logs (initial check)
        run: docker logs mongo || true

      - name: Run tests
        run: |
          docker exec numismatic-app go test ./tests

      - name: Show MongoDB logs (post-check)
        run: docker logs mongo || true

      - name: Stop and remove containers
        run: |
          docker-compose down
