services:
  app:
    #restart: "no"
    container_name: numismatic-app
    build: .
    command: ./app
    ports:
      - "80:80"
    depends_on:
      - mongo
      - redis
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DATABASE=coins
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=

  mongo:
    #restart: "no"
    container_name: mongo
    image: mongo:latest
    volumes:
      - /data/db
    environment:
      - MONGO_INITDB_DATABASE=coins
    ports:
      - "27017:27017"
    command:
      mongod

  redis:
    #restart: "no"
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"